name: Daily 7-night price comparison

on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for public OTA reads
        run: npx playwright install --with-deps chromium

      - name: Fetch 7-night average prices
        env:
          LODGIFY_API_KEY: ${{ secrets.LODGIFY_API_KEY }}
        run: node scripts/prices/fetch-prices.mjs

      - name: Commit data/prices.json when changed
        run: |
          if git diff --quiet -- data/prices.json && [ -z "$(git ls-files --others --exclude-standard -- data/prices.json)" ]; then
            echo "No price changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "Update daily 7-night average prices"
          git push origin main
